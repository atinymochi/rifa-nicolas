<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Rifa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <div class="brand">
    <h1>Gran rifa para <span id="admin-trigger" style="cursor:pointer;">Nicolás</span></h1>
    <p>Sorteo · Al vender el 100% de los números</p>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="stat-label">Total</div><div class="stat-value">300</div></div>
  <div class="stat"><div class="stat-label">Vendidos</div><div class="stat-value" id="stat-sold">0</div></div>
  <div class="stat"><div class="stat-label">Disponibles</div><div class="stat-value" id="stat-avail">300</div></div>
</div>

<div class="login-section" id="login-section" style="display:none;">
  <div class="login-row">
    <input type="password" id="pwd" placeholder="Clave de administrador..." />
    <button class="btn accent" id="btn-login">Entrar</button>
  </div>
</div>

<div id="admin-section" style="display:none;">
  <div class="admin-badge">Modo administrador activo</div>
  <p class="hint">Clic en un número para vender, cambiar estado o liberarlo.</p>
</div>

<div class="legend">
  <span><span class="legend-box" style="background:#1a1a1a;border:1px solid #2a2a2a;"></span>Disponible</span>
  <span><span class="legend-box" style="background:var(--sold-pending);"></span>Pendiente</span>
  <span><span class="legend-box" style="background:var(--sold-paid);"></span>Pagado</span>
</div>

<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<!-- Modal: vender número -->
<div class="modal-overlay" id="modal-sell">
  <div class="modal">
    <h2>Número <span id="modal-num"></span></h2>
    <p>Ingresa los datos de la venta:</p>
    <input type="text" id="modal-name" placeholder="Nombre del comprador..." maxlength="40" />
    <select id="modal-status">
      <option value="pending">Pendiente (Naranjo)</option>
      <option value="paid" selected>Pagado (Verde)</option>
    </select>
    <div class="modal-buttons-row">
      <button class="btn btn-close-modal">Cancelar</button>
      <button class="btn accent" id="btn-confirm-sell">Confirmar venta</button>
    </div>
  </div>
</div>

<!-- Modal: liberar o modificar número -->
<div class="modal-overlay" id="modal-release">
  <div class="modal">
    <h2>Número <span id="release-num"></span></h2>
    <p class="release-info">
      Comprador: <strong id="release-owner"></strong><br>
      Estado actual: <strong id="release-status-text"></strong>
    </p>
    <div class="modal-buttons">
      <button class="btn warning" id="btn-toggle-status"></button>
      <button class="btn danger" id="btn-confirm-release">Liberar número</button>
      <button class="btn btn-close-modal">Cancelar</button>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
